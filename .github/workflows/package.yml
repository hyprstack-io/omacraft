name: Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install the build tools
        run: |
          pacman -Syu --noconfirm git github-cli namcap
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and install the package
        run: |
          chown -R builder .
          sudo -u builder sh -c 'cd pkgbuild && makepkg -si --noconfirm'
      - name: Check the package
        run: namcap pkgbuild/omacraft-*.pkg.tar.zst
      - name: Test
        run: sudo -u builder bin/test
      - name: Smoke test
        run: |
          omacraft --version
          omacraft-doctor || true
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$PWD"
          gh release create "$GITHUB_REF_NAME" pkgbuild/omacraft-*.pkg.tar.zst --draft --generate-notes
