# HyprVYZR: HyprVYZR's theme for the Kasm dashboard.
# Added by hyprvyze/kasm-theme/install.sh. To go back to stock Kasm, run
# `install.sh --remove` (or delete this file and ../hyprvyze/, then
# `docker exec kasm_proxy nginx -s reload`). Kasm's own files are untouched.
#
# The dashboard page gets the stylesheet and a small script added before
# </head>; everything else Kasm serves is left as it is. @VERSION@ busts
# browser caches on each install.

location = / {
    root /srv/www;
    index index.html;
}

location = /index.html {
    root /srv/www;
    sub_filter '</head>' '<link rel="stylesheet" href="/hyprvyze/duckbones.css?v=@VERSION@"><script src="/hyprvyze/duckbones.js?v=@VERSION@"></script></head>';
    sub_filter_once on;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff";
}

location ^~ /hyprvyze/ {
    alias /etc/nginx/conf.d/hyprvyze/;
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive";
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff";
}
